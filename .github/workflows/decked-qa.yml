name: DECKED browser playtest

on:
  push:
    branches: [main]
    paths:
      - index.html
      - decked.js
      - library.js
      - ytpmp3.js
      - stem-ai.js
      - stem-worker.js
      - tests/stem-engine-unit.cjs
      - sw.js
      - tests/browser-qa.cjs
      - .github/workflows/decked-qa.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: decked-browser-qa
  cancel-in-progress: true

jobs:
  playtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install free browser testing tools
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Verify SCNet STFT, inverse FFT and stem reconstruction
        run: node tests/stem-engine-unit.cjs
      - name: Run touch and Safari-like playtests
        run: node tests/browser-qa.cjs
      - name: Save screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: decked-browser-qa
          path: qa-artifacts/
          retention-days: 7
